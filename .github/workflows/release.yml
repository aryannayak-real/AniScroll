name: AniScroll Main Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aniscroll-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build and publish main AniScroll
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Read app version
        id: version
        run: |
          set -e
          version_name="$(sed -n 's/^releaseVersionName=//p' gradle.properties | tail -1)"
          version_code="$(sed -n 's/^releaseVersionCode=//p' gradle.properties | tail -1)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::App version is missing from gradle.properties"
            exit 1
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "tag=v$version_name" >> "$GITHUB_OUTPUT"

      - name: Checkout submodules
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://$GH_PAT@github.com/".insteadOf "https://github.com/"
          fi
          git submodule update --init --recursive

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c

      - name: Write client_secrets.json (optional)
        env:
          GOOGLE_CLIENT_SECRETS_JSON: ${{ secrets.GOOGLE_CLIENT_SECRETS_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_SECRETS_JSON" ]; then
            mkdir -p app/src/main/assets
            printf '%s' "$GOOGLE_CLIENT_SECRETS_JSON" > app/src/main/assets/client_secrets.json
          fi

      - name: Clean CMake cache
        run: rm -rf app/.cxx chimahon/.cxx

      - name: Build main production APKs
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign production APKs
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APKs
        run: |
          set -e
          dir="app/build/outputs/apk/release"
          version="${{ steps.version.outputs.name }}"
          mv "$dir/app-universal-release-unsigned-signed.apk" "AniScroll-$version.apk"
          mv "$dir/app-arm64-v8a-release-unsigned-signed.apk" "AniScroll-arm64-v8a-$version.apk"
          mv "$dir/app-armeabi-v7a-release-unsigned-signed.apk" "AniScroll-armeabi-v7a-$version.apk"
          mv "$dir/app-x86-release-unsigned-signed.apk" "AniScroll-x86-$version.apk"
          mv "$dir/app-x86_64-release-unsigned-signed.apk" "AniScroll-x86_64-$version.apk"

      - name: Publish normal GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AniScroll ${{ steps.version.outputs.name }}
          body: |
            AniScroll ${{ steps.version.outputs.name }}

            Production build from main.
            Commit: ${{ github.sha }}
          files: |
            AniScroll-${{ steps.version.outputs.name }}.apk
            AniScroll-arm64-v8a-${{ steps.version.outputs.name }}.apk
            AniScroll-armeabi-v7a-${{ steps.version.outputs.name }}.apk
            AniScroll-x86-${{ steps.version.outputs.name }}.apk
            AniScroll-x86_64-${{ steps.version.outputs.name }}.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
